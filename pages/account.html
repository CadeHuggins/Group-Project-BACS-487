<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Page | Application Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<header id="header"></header>
 
<main>
  <h2>Account Page</h2>
 
  <div class="two">
    <!-- Function: Profile -->
    <form class="box" id="profile-form">
      <h3>Profile</h3>
      <label for="name">Full name</label><input id="name" type="text">
      <label for="year">Year in school</label>
      <select id="year"><option>Freshman</option><option>Sophomore</option><option>Junior</option><option>Senior</option><option>Graduate</option></select>
      <label for="major">Major</label><input id="major" type="text">
      <button type="submit">Save profile</button>
    </form>
 
    <!-- Function: Settings -->
    <form class="box" id="settings-form">
      <h3>Settings</h3>
      <label for="email">Email</label><input id="email" type="email">
      <label for="newpw">New password</label><input id="newpw" type="password" autocomplete="new-password">
      <label class="check"><input type="checkbox" id="opt-remind"> Email me reminders at this address</label>
      <label class="check"><input type="checkbox" id="opt-weekly"> Weekly progress summary</label>
      <button type="submit">Save settings</button>
    </form>
  </div>
 
  <!-- Function: Job Types -->
  <div class="box">
    <h3>Job Types</h3>
    <p class="muted" style="margin-top:0">Pick the kinds of roles you are looking for.</p>
    <div class="opts" id="types"></div>
  </div>
 
  <!-- Function: Stats on applied jobs -->
  <div class="box">
    <h3>Stats on applied jobs</h3>
    <p class="muted" id="stats-sub" style="margin-top:0">Based on the jobs you have linked.</p>
    <div id="bars"></div>
    <p class="muted" id="rate"></p>
  </div>
</main>
 
<script src="app.js"></script>
<script>
  renderHeader("account");
 
  /* ----- Profile + Settings ----- */
  const user = Store.get("user", { name: "" });
  const settings = Store.get("settings", { email: "", remind: true, weekly: false });
  $("name").value = user.name || "";
  $("year").value = user.year || "Freshman";
  $("major").value = user.major || "";
  $("email").value = user.email || settings.email || "";
  $("opt-remind").checked = settings.remind;
  $("opt-weekly").checked = settings.weekly;
 
  $("profile-form").addEventListener("submit", e => {
    e.preventDefault();
    Store.set("user", { ...Store.get("user", {}), name: $("name").value.trim() || "Student", year: $("year").value, major: $("major").value.trim() });
    toast("Profile saved");
  });
 
  $("settings-form").addEventListener("submit", e => {
    e.preventDefault();
    // Password changes are handled by the backend later; we never store it here.
    const email = $("email").value.trim();
    Store.set("user", { ...Store.get("user", {}), email });   // same email used on every page
    Store.set("settings", { remind: $("opt-remind").checked, weekly: $("opt-weekly").checked });
    $("newpw").value = "";
    toast("Settings saved");
  });
 
  /* ----- Job Types ----- */
  const TYPES = ["Internship", "Part-time", "Full-time (entry level)", "Co-op", "Research", "Remote"];
  let chosen = Store.get("jobTypes", []);
  $("types").innerHTML = TYPES.map(t => `<label class="check"><input type="checkbox" value="${t}" ${chosen.includes(t) ? "checked" : ""}> ${t}</label>`).join("");
  $("types").addEventListener("change", () => {
    chosen = [...$("types").querySelectorAll("input:checked")].map(i => i.value);
    Store.set("jobTypes", chosen);
    toast("Job types saved");
  });
 
  /* ----- Stats on applied jobs ----- */
  const jobs = Store.get("jobs", []);
  if (!jobs.length) $("stats-sub").textContent = "No jobs linked yet. Add one from the Home page to see your stats.";
  $("bars").innerHTML = STATUSES.map(s => {
    const n = jobs.filter(j => j.status === s).length;
    const pct = jobs.length ? Math.round((n / jobs.length) * 100) : 0;
    return `<div class="bar-row"><span>${s}</span><div class="bar"><i class="${s === "Offer" ? "gold" : ""}" style="width:${pct}%"></i></div><b>${n}</b></div>`;
  }).join("");
  if (jobs.length) {
    const good = jobs.filter(j => j.status === "Interview" || j.status === "Offer").length;
    $("rate").textContent = "Response rate: " + Math.round((good / jobs.length) * 100) + "% reached interview or offer";
  }
</script>
</body>
</html>
