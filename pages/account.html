<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account Page | Application Tracker</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
 
<header id="header"></header>
 
<main>
  <h2>Account Page</h2>
 
  <div class="two">
    <!-- Link to the Profile page -->
    <div class="box">
      <h3>Profile</h3>
      <div class="who">
        <span class="avatar" id="avatar" aria-hidden="true">S</span>
        <div><b id="a-name">Student</b><span class="muted" id="a-email"></span></div>
      </div>
      <ul class="sum" id="profile-sum"></ul>
      <a class="btn" href="profile.html" style="margin-top:1rem">Edit profile</a>
    </div>
 
    <!-- Link to the Settings page -->
    <div class="box">
      <h3>Settings</h3>
      <ul class="sum" id="settings-sum"></ul>
      <a class="btn" href="settings.html" style="margin-top:1rem">Open settings</a>
    </div>
  </div>
 
  <!-- Function: Job Types -->
  <div class="box" style="margin-top:1rem">
    <h3>Job Types</h3>
    <p class="muted" style="margin-top:0">Pick the kinds of roles you are looking for.</p>
    <div class="opts" id="types"></div>
  </div>
 
  <!-- Function: Stats on applied jobs -->
  <div class="box">
    <h3>Stats on applied jobs</h3>
    <p class="muted" id="stats-sub" style="margin-top:0">Based on the jobs you have linked.</p>
    <div id="bars"></div>
    <p class="muted" id="rate"></p>
  </div>
</main>
 
<script src="app.js"></script>
<script>
  renderHeader("account");
 
  /* ----- Profile and settings summaries ----- */
  const user = Store.get("user", {});
  $("avatar").textContent = ((user.name || "S").trim().charAt(0) || "S").toUpperCase();
  $("a-name").textContent = user.name || "Student";
  $("a-email").textContent = user.email || "No email added yet";
  const row = (k, v) => `<li><span>${k}</span><span>${esc(v || "Not added")}</span></li>`;
  $("profile-sum").innerHTML = row("School", user.school) + row("Major", user.major) + row("Year", user.year);
 
  const s = getSettings();
  const onoff = v => v ? "On" : "Off";
  $("settings-sum").innerHTML =
    row("Login pop-up", onoff(s.popup)) + row("Follow-up reminders", s.followup ? "On, after " + s.followDays + " days" : "Off") +
    row("Deadline reminders", s.deadline ? "On, " + s.deadlineDays + " days before" : "Off") + row("Event reminders", onoff(s.events));
 
  /* ----- Job Types ----- */
  const TYPES = ["Internship", "Part-time", "Full-time (entry level)", "Co-op", "Research", "Remote"];
  let chosen = Store.get("jobTypes", []);
  $("types").innerHTML = TYPES.map(t => `<label class="check"><input type="checkbox" value="${t}" ${chosen.includes(t) ? "checked" : ""}> ${t}</label>`).join("");
  $("types").addEventListener("change", () => {
    chosen = [...$("types").querySelectorAll("input:checked")].map(i => i.value);
    Store.set("jobTypes", chosen);
    toast("Job types saved");
  });
 
  /* ----- Stats on applied jobs ----- */
  const jobs = Store.get("jobs", []);
  if (!jobs.length) $("stats-sub").textContent = "No jobs linked yet. Add one from the Home page to see your stats.";
  $("bars").innerHTML = STATUSES.map(st => {
    const n = jobs.filter(j => j.status === st).length;
    const pct = jobs.length ? Math.round((n / jobs.length) * 100) : 0;
    return `<div class="bar-row"><span>${st}</span><div class="bar"><i class="${st === "Offer" ? "gold" : ""}" style="width:${pct}%"></i></div><b>${n}</b></div>`;
  }).join("");
  const applied = jobs.filter(j => j.status !== "Potential");
  if (applied.length) {
    const good = applied.filter(j => j.status === "Interview" || j.status === "Offer").length;
    $("rate").textContent = "Response rate: " + Math.round((good / applied.length) * 100) + "% of applications reached an interview or offer";
  }
</script>
</body>
</html>
