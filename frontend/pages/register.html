
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete Registration | Application Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
  <h1>Application <span>Tracker</span></h1>
</header>

<main class="narrow">
  <h2>Complete Your Profile</h2>
  <p>You're signed in with Google. Finish setting up your account.</p>

  <form class="box" id="register-form">
    <label for="fullname">Full name</label>
    <input id="fullname" type="text" autocomplete="name" required>

    <label for="email">Google email</label>
    <input id="email" type="email" readonly>

    <p class="error hidden" id="error" role="alert"></p>

    <button type="submit" class="block" id="register-button">
      Complete Registration
    </button>
  </form>
</main>

<script>
  const form = document.getElementById("register-form");
  const errorElement = document.getElementById("error");
  const registerButton = document.getElementById("register-button");

  function showError(message) {
    errorElement.textContent = message;
    errorElement.classList.remove("hidden");
  }

  async function loadProfile() {
    try {
      const response = await fetch("/api/auth/me", {
        credentials: "same-origin"
      });

      if (!response.ok) {
        window.location.replace("/frontend/pages/login.html");
        return;
      }

      const data = await response.json();
      const student = data.student || data;

      if (student.registration_completed === true ||
          student.registrationCompleted === true) {
        window.location.replace("/");
        return;
      }

      document.getElementById("fullname").value = student.name || "";
      document.getElementById("email").value = student.email || "";
    } catch (error) {
      showError("Could not load your profile.");
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorElement.classList.add("hidden");

    const name = document.getElementById("fullname").value.trim();

    if (!name) {
      return showError("Please enter your full name.");
    }

    registerButton.disabled = true;
    registerButton.textContent = "Saving...";

    try {
      const response = await fetch("/api/auth/complete-registration", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        credentials: "same-origin",
        body: JSON.stringify({ name })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Registration failed.");
      }

      window.location.replace("/");
    } catch (error) {
      showError(error.message);
    } finally {
      registerButton.disabled = false;
      registerButton.textContent = "Complete Registration";
    }
  });

  loadProfile();
</script>

</body>
</html>
